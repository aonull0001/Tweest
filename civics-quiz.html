<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7f2">
  <meta name="description" content="中学公民の重要語句43問に、ステージ制と全問モードで楽しく挑戦。">
  <title>中学公民クイズ | 自主学習</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --ink: #26342e;
      --muted: #68776f;
      --green: #2d7657;
      --green-dark: #205b41;
      --mint: #e6f4eb;
      --paper: #fffefa;
      --line: #e3ebe3;
      --yellow: #f3c94f;
      --red: #d94f53;
      --shadow: 0 12px 30px rgba(37, 73, 52, .09);
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: var(--ink); background: #f6f7f2; font-family: "Zen Kaku Gothic New", sans-serif; line-height: 1.7; }
    button, a { font: inherit; }
    a { color: inherit; }
    .site-header { display: flex; justify-content: space-between; align-items: center; width: min(940px, calc(100% - 40px)); margin: 0 auto; padding: 18px 0; }
    .brand { color: var(--green-dark); font-size: 14px; font-weight: 900; text-decoration: none; }
    .home-link { color: var(--muted); font-size: 13px; font-weight: 700; text-decoration: none; }
    .home-link:hover { color: var(--green); }
    main { width: min(760px, calc(100% - 32px)); margin: 26px auto 60px; }
    .app-card { overflow: hidden; border: 1px solid var(--line); border-radius: 22px; background: var(--paper); box-shadow: var(--shadow); }
    .top-accent { height: 9px; background: linear-gradient(90deg, #51a875, #a4d16b, #f3c94f); }
    .screen { padding: clamp(22px, 5vw, 42px); }
    .hidden { display: none !important; }
    .eyebrow { margin: 0 0 7px; color: var(--green); font-size: 12px; font-weight: 900; letter-spacing: .13em; }
    h1 { margin: 0; font-size: clamp(28px, 6vw, 42px); font-weight: 900; line-height: 1.35; }
    .intro { max-width: 570px; margin: 12px 0 25px; color: var(--muted); }
    .mode-title { margin: 26px 0 10px; font-size: 16px; font-weight: 900; }
    .stage-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .stage-button, .full-button, .primary-button, .secondary-button { min-height: 54px; padding: 12px 16px; border: 0; border-radius: 13px; font-weight: 900; cursor: pointer; transition: transform .16s, background-color .16s, box-shadow .16s; }
    .stage-button { display: flex; justify-content: space-between; align-items: center; gap: 10px; border: 2px solid var(--line); background: white; color: var(--ink); text-align: left; }
    .stage-button span:last-child { color: var(--muted); font-size: 12px; font-weight: 500; white-space: nowrap; }
    .stage-button:hover, .stage-button:focus-visible { transform: translateY(-2px); border-color: #7fbd91; box-shadow: 0 5px 12px rgba(37, 73, 52, .08); }
    .full-button { width: 100%; margin-top: 12px; background: var(--green); color: white; box-shadow: 0 4px 0 var(--green-dark); }
    .full-button:hover, .primary-button:hover { transform: translateY(-2px); }
    .full-button:active, .primary-button:active { transform: translateY(2px); box-shadow: none; }
    .quiz-head { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 16px; margin-bottom: 20px; }
    .progress-track { height: 14px; overflow: hidden; border-radius: 99px; background: #e9eee8; }
    .progress-fill { width: 0; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #6bbf78, #9ad85e); transition: width .3s ease; }
    .lives { color: var(--red); font-size: 21px; font-weight: 900; letter-spacing: 2px; white-space: nowrap; }
    .quiz-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; }
    .pill { padding: 3px 10px; border-radius: 99px; background: var(--mint); color: var(--green-dark); font-size: 12px; font-weight: 900; }
    .combo { margin-left: auto; color: #b67915; font-size: 14px; font-weight: 900; }
    .question { margin: 18px 0 22px; font-size: clamp(19px, 4vw, 23px); font-weight: 700; line-height: 1.8; overflow-wrap: anywhere; }
    .choices { display: grid; gap: 11px; }
    .choice-button { width: 100%; min-height: 58px; padding: 13px 16px; border: 2px solid #e1e9e1; border-bottom-width: 4px; border-radius: 14px; background: white; color: var(--ink); font-size: 16px; font-weight: 700; text-align: left; cursor: pointer; overflow-wrap: anywhere; transition: border-color .14s, background-color .14s, transform .14s; }
    .choice-button:hover:not(:disabled), .choice-button:focus-visible { transform: translateY(-1px); border-color: #7fbd91; background: #f6fcf6; }
    .choice-button:disabled { cursor: default; }
    .choice-button.correct { border-color: #57a66b; background: #e8f7e9; color: #225e35; }
    .choice-button.incorrect { border-color: #dc7371; background: #fff0ee; color: #923b3b; }
    .feedback { margin-top: 18px; padding: 16px 18px; border-radius: 14px; background: var(--mint); }
    .feedback.is-wrong { background: #fff0ee; }
    .feedback-title { margin: 0 0 4px; font-size: 18px; font-weight: 900; }
    .feedback-answer { margin: 0; color: #52635a; font-size: 14px; }
    .primary-button, .secondary-button { width: 100%; margin-top: 16px; }
    .primary-button { background: var(--green); color: white; box-shadow: 0 4px 0 var(--green-dark); }
    .secondary-button { border: 2px solid var(--line); background: white; color: var(--green-dark); }
    .secondary-button:hover { background: #f2f8f2; }
    .result-icon { margin: 2px 0 5px; font-size: 60px; line-height: 1.2; text-align: center; }
    .result-heading { text-align: center; }
    .result-score { margin: 13px 0 3px; color: var(--green); font-size: clamp(34px, 8vw, 52px); font-weight: 900; text-align: center; }
    .result-copy { margin: 0 0 20px; color: var(--muted); text-align: center; }
    .missed-list { display: grid; gap: 9px; margin-top: 20px; }
    .missed-item { padding: 12px 14px; border-radius: 12px; background: #f6f7f2; font-size: 13px; }
    .missed-item strong { display: block; margin-top: 3px; color: var(--green-dark); }
    .toast-error { margin-top: 16px; padding: 12px 14px; border-radius: 10px; background: #fff0ee; color: #923b3b; font-weight: 700; }
    footer { padding: 4px 16px 24px; color: var(--muted); font-size: 12px; text-align: center; }
    @media (max-width: 520px) {
      .site-header { width: calc(100% - 32px); }
      main { width: calc(100% - 20px); margin-top: 12px; }
      .app-card { border-radius: 17px; }
      .screen { padding: 22px 18px 24px; }
      .stage-grid { grid-template-columns: 1fr; }
      .quiz-head { gap: 10px; }
      .lives { font-size: 18px; letter-spacing: 1px; }
      .choice-button { min-height: 54px; padding: 12px; font-size: 15px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">自主学習クイズ</a>
    <a class="home-link" href="index.html">← メインページへ</a>
  </header>
  <main>
    <div class="app-card">
      <div class="top-accent" aria-hidden="true"></div>
      <section id="loading-screen" class="screen" aria-live="polite">公民クイズを準備しています…</section>
      <section id="start-screen" class="screen hidden">
        <p class="eyebrow">JUNIOR HIGH · CIVICS</p>
        <h1>中学公民クイズ</h1>
        <p class="intro">大切な用語43問にチャレンジ！正解を選んで、ステージクリアを目指そう。ライフは3つ。間違えた問題は最後に復習できます。</p>
        <h2 class="mode-title">10問ずつ挑戦</h2>
        <div id="stage-list" class="stage-grid"></div>
        <button id="full-run-button" type="button" class="full-button">全43問に挑戦する　→</button>
        <div id="data-error" class="toast-error hidden" role="alert"></div>
      </section>
      <section id="quiz-screen" class="screen hidden" aria-live="polite">
        <div class="quiz-head">
          <div class="progress-track" role="progressbar" aria-label="ステージの進み具合" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="progress-fill" class="progress-fill"></div></div>
          <div id="lives" class="lives" aria-label="残りライフ3">♥ ♥ ♥</div>
        </div>
        <div class="quiz-meta"><span id="question-counter" class="pill"></span><span id="mode-label" class="pill"></span><span id="combo-label" class="combo" aria-live="polite"></span></div>
        <p id="question-text" class="question"></p>
        <div id="choice-list" class="choices" role="group" aria-label="解答の選択肢"></div>
        <div id="feedback" class="feedback hidden" aria-live="polite"><p id="feedback-title" class="feedback-title"></p><p id="feedback-answer" class="feedback-answer"></p></div>
        <button id="continue-button" type="button" class="primary-button hidden">次へ　→</button>
      </section>
      <section id="result-screen" class="screen hidden">
        <div id="result-icon" class="result-icon" aria-hidden="true"></div>
        <h1 id="result-title" class="result-heading"></h1>
        <p id="result-score" class="result-score"></p>
        <p id="result-copy" class="result-copy"></p>
        <div id="missed-list" class="missed-list"></div>
        <button id="review-button" type="button" class="primary-button hidden">間違えた問題を復習する　↻</button>
        <button id="home-button" type="button" class="secondary-button">ステージ選択に戻る</button>
        <a class="home-link" href="index.html" style="display:block;margin-top:18px;text-align:center;">メインページへ戻る</a>
      </section>
    </div>
  </main>
  <footer>一問ずつ、できることを増やしていこう。</footer>
  <script src="civics-questions.js?v=1"></script>
  <script>
    'use strict';
    const data = Array.isArray(window.CIVICS_QUIZ_DATA) ? window.CIVICS_QUIZ_DATA : [];
    const screens = {
      loading: document.getElementById('loading-screen'),
      start: document.getElementById('start-screen'),
      quiz: document.getElementById('quiz-screen'),
      result: document.getElementById('result-screen')
    };
    const state = { questions: [], index: 0, score: 0, lives: 3, combo: 0, misses: [], mode: 'stage', locked: false };
    const validationError = validateData(data);
    if (validationError) {
      screens.loading.textContent = validationError;
    } else {
      screens.loading.classList.add('hidden');
      screens.start.classList.remove('hidden');
      renderStages();
    }

    function validateData(questions) {
      if (questions.length !== 43) return '問題データが43問読み込めませんでした。データファイルを確認してください。';
      for (let index = 0; index < questions.length; index++) {
        const item = questions[index];
        if (item.id !== index + 1 || typeof item.question !== 'string' || typeof item.answer !== 'string' || !Array.isArray(item.distractors) || item.distractors.length !== 3) return `問題 ${index + 1} のデータを確認してください。`;
        const choices = [item.answer, ...item.distractors];
        if (choices.some(choice => typeof choice !== 'string' || !choice.trim()) || new Set(choices).size !== 4) return `問題 ${item.id} の選択肢に重複または空欄があります。`;
      }
      return '';
    }

    function renderStages() {
      const container = document.getElementById('stage-list');
      container.replaceChildren();
      const stageCount = Math.ceil(data.length / 10);
      for (let stage = 0; stage < stageCount; stage++) {
        const first = stage * 10 + 1;
        const last = Math.min(first + 9, data.length);
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'stage-button';
        button.innerHTML = `<span>ステージ ${stage + 1}</span><span>Q${first}–${last} · ${last - first + 1}問</span>`;
        button.addEventListener('click', () => startRun(data.slice(first - 1, last), `ステージ ${stage + 1}`));
        container.appendChild(button);
      }
      document.getElementById('full-run-button').addEventListener('click', () => startRun(data, '全43問'));
      document.getElementById('home-button').addEventListener('click', showStart);
      document.getElementById('review-button').addEventListener('click', () => {
        if (state.misses.length) startRun(state.misses, 'まちがい復習');
      });
    }

    function startRun(questions, label) {
      state.questions = questions.slice();
      state.index = 0;
      state.score = 0;
      state.lives = 3;
      state.combo = 0;
      state.misses = [];
      state.mode = label;
      state.locked = false;
      screens.start.classList.add('hidden');
      screens.result.classList.add('hidden');
      screens.quiz.classList.remove('hidden');
      renderQuestion();
    }

    function renderQuestion() {
      const item = state.questions[state.index];
      state.locked = false;
      const progress = Math.round((state.index / state.questions.length) * 100);
      const track = document.querySelector('.progress-track');
      track.setAttribute('aria-valuenow', String(progress));
      document.getElementById('progress-fill').style.width = `${progress}%`;
      document.getElementById('lives').textContent = `${'♥ '.repeat(state.lives)}${'♡ '.repeat(3 - state.lives)}`.trim();
      document.getElementById('lives').setAttribute('aria-label', `残りライフ${state.lives}`);
      document.getElementById('question-counter').textContent = `問題 ${state.index + 1} / ${state.questions.length}`;
      document.getElementById('mode-label').textContent = state.mode;
      document.getElementById('combo-label').textContent = state.combo >= 2 ? `🔥 ${state.combo}連続正解` : '';
      document.getElementById('question-text').textContent = item.question;
      document.getElementById('feedback').classList.add('hidden');
      document.getElementById('feedback').classList.remove('is-wrong');
      document.getElementById('continue-button').classList.add('hidden');
      const list = document.getElementById('choice-list');
      list.replaceChildren();
      shuffle([item.answer, ...item.distractors]).forEach(choice => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'choice-button';
        button.textContent = choice;
        button.addEventListener('click', () => chooseAnswer(button, choice, item));
        list.appendChild(button);
      });
    }

    function chooseAnswer(selectedButton, selectedAnswer, item) {
      if (state.locked) return;
      state.locked = true;
      const correct = selectedAnswer === item.answer;
      document.querySelectorAll('.choice-button').forEach(button => {
        button.disabled = true;
        if (button.textContent === item.answer) button.classList.add('correct');
        else if (button === selectedButton && !correct) button.classList.add('incorrect');
      });
      const feedback = document.getElementById('feedback');
      feedback.classList.remove('hidden');
      feedback.classList.toggle('is-wrong', !correct);
      document.getElementById('feedback-title').textContent = correct ? 'すばらしい！正解 🎉' : 'おしい！正解を確認しよう';
      document.getElementById('feedback-answer').textContent = correct ? 'その調子で進もう！' : `正解：${item.answer}`;
      if (correct) {
        state.score++;
        state.combo++;
      } else {
        state.lives--;
        state.combo = 0;
        state.misses.push(item);
      }
      const completedProgress = Math.round(((state.index + 1) / state.questions.length) * 100);
      document.querySelector('.progress-track').setAttribute('aria-valuenow', String(completedProgress));
      document.getElementById('progress-fill').style.width = `${completedProgress}%`;
      document.getElementById('lives').textContent = `${'♥ '.repeat(state.lives)}${'♡ '.repeat(3 - state.lives)}`.trim();
      document.getElementById('lives').setAttribute('aria-label', `残りライフ${state.lives}`);
      document.getElementById('combo-label').textContent = state.combo >= 2 ? `🔥 ${state.combo}連続正解` : '';
      document.getElementById('continue-button').textContent = state.lives === 0 ? '結果を見る' : state.index + 1 === state.questions.length ? '結果を見る' : '次へ　→';
      document.getElementById('continue-button').classList.remove('hidden');
      document.getElementById('continue-button').focus();
    }

    document.getElementById('continue-button').addEventListener('click', () => {
      if (!state.locked) return;
      state.index++;
      if (state.lives === 0 || state.index >= state.questions.length) showResults();
      else renderQuestion();
    });

    function showResults() {
      screens.quiz.classList.add('hidden');
      screens.result.classList.remove('hidden');
      const complete = state.index >= state.questions.length && state.lives > 0;
      document.getElementById('result-icon').textContent = complete ? (state.misses.length ? '🌟' : '🏆') : '💪';
      document.getElementById('result-title').textContent = complete ? (state.misses.length ? 'ステージクリア！' : 'パーフェクト！') : 'ここまでよく頑張ったね！';
      document.getElementById('result-score').textContent = `${state.score} / ${state.index} 問正解`;
      document.getElementById('result-copy').textContent = complete ? '間違えた問題を復習して、知識を定着させよう。' : 'ライフを使い切りました。間違えた問題を復習して再挑戦しよう。';
      const missedList = document.getElementById('missed-list');
      missedList.replaceChildren();
      state.misses.forEach(item => {
        const entry = document.createElement('div');
        entry.className = 'missed-item';
        const prompt = document.createElement('span');
        prompt.textContent = `Q${item.id}　${item.question}`;
        const answer = document.createElement('strong');
        answer.textContent = `正解：${item.answer}`;
        entry.append(prompt, answer);
        missedList.appendChild(entry);
      });
      const reviewButton = document.getElementById('review-button');
      reviewButton.classList.toggle('hidden', state.misses.length === 0);
      document.getElementById('home-button').textContent = 'ステージ選択に戻る';
    }

    function showStart() {
      screens.quiz.classList.add('hidden');
      screens.result.classList.add('hidden');
      screens.start.classList.remove('hidden');
    }

    function shuffle(items) {
      for (let index = items.length - 1; index > 0; index--) {
        const swapIndex = Math.floor(Math.random() * (index + 1));
        [items[index], items[swapIndex]] = [items[swapIndex], items[index]];
      }
      return items;
    }
  </script>
</body>
</html>
